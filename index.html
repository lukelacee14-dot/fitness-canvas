<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fitness Canvas</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f0f0f2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/canvas.css">
<link rel="stylesheet" href="css/modules.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1 class="app-header__title">Fitness Canvas</h1>
  </header>

  <main id="screen" class="screen">
    <p class="screen-empty">Tap + to add your first tool.</p>
  </main>

  <nav id="bottom-bar" class="bottom-bar">
    <div id="tab-strip" class="tab-strip"></div>
    <button id="add-btn" class="bottom-bar__add" type="button" aria-label="Add a tool">+</button>
  </nav>
</div>

<div id="picker" class="overlay" hidden>
  <div class="overlay__panel">
    <div class="overlay__header">
      <h2>Add a Tool</h2>
      <button id="picker-close" class="icon-btn" type="button" aria-label="Close">&#10005;</button>
    </div>
    <div id="picker-list" class="overlay__body"></div>
  </div>
</div>

<div id="remove-confirm" class="overlay overlay--center" hidden>
  <div class="confirm-dialog">
    <p class="confirm-dialog__text">Remove <strong id="remove-confirm-name"></strong> from your bar?</p>
    <div class="confirm-dialog__actions">
      <button id="remove-confirm-cancel" type="button" class="btn-secondary">Cancel</button>
      <button id="remove-confirm-ok" type="button" class="btn-danger">Remove</button>
    </div>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/catalog.js"></script>
<script src="js/registry.js"></script>
<script src="js/tabs.js"></script>
<script src="js/remove-confirm.js"></script>
<script src="js/tabstrip.js"></script>
<script src="js/picker.js"></script>
<script src="modules/workout-logger/module.js"></script>
<script src="modules/program-builder/module.js"></script>
<script src="modules/meal-tracker/module.js"></script>
<script src="js/main.js"></script>
</body>
</html>
